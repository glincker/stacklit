* { box-sizing: border-box; }

.search-btn { white-space: nowrap; min-width: 0; color: var(--muted); }

/* Details panel */
.panel { color: var(--text); min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--surface); padding: var(--s-6); }

.crumbs { position: absolute; top: var(--s-4); left: var(--s-6); right: var(--s-6); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); pointer-events: none; font-size: var(--fs-sm); color: var(--muted); }

.tip { position: fixed; left: 0; top: 0; z-index: 30; max-width: 280px; padding: var(--s-2) var(--s-3); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-2); box-shadow: var(--shadow); pointer-events: none; font-size: var(--fs-sm); opacity: 0; transition: opacity var(--dur-1) var(--ease); }

/* Single module and empty states */
.solo { height: 100%; display: grid; place-items: center; padding: var(--s-6); overflow: auto; }
.card { color: var(--text); width: min(560px, 100%); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-3); padding: var(--s-8); }

th[aria-sort="descending"] .th-btn::after { content: "\2193"; }
tbody tr:hover td { background: var(--sunk); }
tbody tr[aria-selected="true"] td { background: var(--accent-soft); }
td.mod a { color: var(--text); font-family: var(--font-mono); text-decoration: none; overflow-wrap: anywhere; }
td.mod a:hover { text-decoration: underline; }
td.act { color: var(--muted); }

/* Symbols */
.sym { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); height: 100%; min-height: 0; }
.sym-side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.sym-filters { display: grid; gap: var(--s-2); padding: var(--s-4); border-bottom: 1px solid var(--line); }
.sym-filters .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
.sym-list { flex: 1; overflow: auto; padding: var(--s-2); }
.sym-item { display: block; width: 100%; padding: var(--s-2) var(--s-3); text-align: left; background: none; border: 0; border-radius: var(--r-2); color: var(--text); }
.sym-item:hover { background: var(--sunk); }
.sym-item[aria-current="true"] { background: var(--accent-soft); }
.sym-item b { display: block; font: 600 var(--fs-sm)/var(--lh-body) var(--font-mono); overflow-wrap: anywhere; }
.sym-item span { display: block; color: var(--muted); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.sym-count { padding: var(--s-2) var(--s-4); color: var(--faint); font-size: var(--fs-xs); border-top: 1px solid var(--line); }
.sym-detail { overflow: auto; padding: var(--s-6); min-width: 0; }
.sig { margin-top: var(--s-3); padding: var(--s-3) var(--s-4); background: var(--sunk); border-radius: var(--r-2); font: var(--fs-sm)/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.sym-name { font: 600 var(--fs-xl)/var(--lh-tight) var(--font-mono); overflow-wrap: anywhere; letter-spacing: -0.02em; }
.sym-detail h3 { font-size: var(--fs-xs); font-weight: 600; color: var(--faint); margin: var(--s-6) 0 var(--s-2); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s-6); }
.select { min-height: 36px; padding: 0 var(--s-2); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-2); min-width: 0; }

/* Palette */
.palette { width: calc(100% - 32px); max-width: 640px; max-height: min(560px, calc(100dvh - 64px)); margin: 10vh auto auto; padding: 0; background: var(--raised); color: var(--text); border: 1px solid var(--line-strong); border-radius: var(--r-3); box-shadow: var(--shadow); overflow: hidden; }
.palette[open] { display: flex; flex-direction: column; }
.palette::backdrop { background: var(--scrim); }
.palette input { width: 100%; min-height: 52px; padding: 0 var(--s-5); background: none; border: 0; border-bottom: 1px solid var(--line); font-size: var(--fs-lg); outline-offset: -2px; }
.results { overflow: auto; padding: var(--s-2); flex: 1; }
.res { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); padding: var(--s-2) var(--s-3); border-radius: var(--r-2); cursor: pointer; }
.res[aria-selected="true"] { background: var(--accent-soft); }
.res .lbl { font: var(--fs-sm)/var(--lh-body) var(--font-mono); overflow-wrap: anywhere; }
.res .kind { flex: none; color: var(--faint); font-size: var(--fs-xs); }
.res .sub { display: block; color: var(--muted); font: var(--fs-xs)/1.4 var(--font-ui); }
.pal-foot { padding: var(--s-2) var(--s-4); border-top: 1px solid var(--line); color: var(--faint); font-size: var(--fs-xs); display: flex; gap: var(--s-4); flex-wrap: wrap; }
.pal-empty { padding: var(--s-5); color: var(--muted); }

.err { padding: var(--s-8); }

/* Narrow screens: the page scrolls, the details panel becomes a bottom sheet */
@media (max-width: 900px) {
  .app { height: auto; min-height: 100dvh; grid-template-rows: auto auto auto; }
  .top { padding: var(--s-3) var(--s-4); }
  .tabs { padding: 0 var(--s-2); }
  .main { display: block; }
  .views { min-height: 0; }
  .view { height: auto; }
  #view-map .stage-wrap, #view-flow .stage-wrap { height: min(72dvh, 640px); }
  .panel { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 62dvh; border: 1px solid var(--line-strong); border-radius: var(--r-3) var(--r-3) 0 0; box-shadow: var(--shadow); padding-top: var(--s-8); }
  .panel.open { display: block; }
  .panel-close { display: inline-flex; }
  .pad, .tree, .tbl-tools { padding-left: var(--s-4); padding-right: var(--s-4); }
  .tbl-wrap { height: auto; max-height: 70dvh; padding: 0 var(--s-4) var(--s-4); }
  .crumbs { left: var(--s-4); right: var(--s-4); }
  .toolbar { left: var(--s-4); bottom: var(--s-4); }
  .minimap, .legend { display: none; }
  .sym { grid-template-columns: 1fr; height: auto; }
  .sym-side { border-right: 0; border-bottom: 1px solid var(--line); }
  .sym-list { max-height: 40dvh; }
  .search-btn .lbl-long, .search-btn kbd, .btn .lbl-hide { display: none; }
  .card { padding: var(--s-5); }
}
@media (max-width: 480px) {
  .row { grid-template-columns: minmax(0, 1fr) 56px; }
  .row .bar { display: none; }
  .ov-stats dd { font-size: var(--fs-xl); }
}
.bar[data-w="0"] { --w: 0; }
.bar[data-w="1"] { --w: 0.05; }
.bar[data-w="2"] { --w: 0.1; }
.bar[data-w="3"] { --w: 0.15; }
.bar[data-w="4"] { --w: 0.2; }
.bar[data-w="5"] { --w: 0.25; }
.bar[data-w="6"] { --w: 0.3; }
.bar[data-w="7"] { --w: 0.35; }
.bar[data-w="8"] { --w: 0.4; }
.bar[data-w="9"] { --w: 0.45; }
.bar[data-w="10"] { --w: 0.5; }
.bar[data-w="11"] { --w: 0.55; }
.bar[data-w="12"] { --w: 0.6; }
.bar[data-w="13"] { --w: 0.65; }
.bar[data-w="14"] { --w: 0.7; }
.bar[data-w="15"] { --w: 0.75; }
.bar[data-w="16"] { --w: 0.8; }
.bar[data-w="17"] { --w: 0.85; }
.bar[data-w="18"] { --w: 0.9; }
.bar[data-w="19"] { --w: 0.95; }
.bar[data-w="20"] { --w: 1; }

.row[aria-level="2"] .nm { padding-left: 16px; }
.row[aria-level="3"] .nm { padding-left: 32px; }
.row[aria-level="4"] .nm { padding-left: 48px; }
.row[aria-level="5"] .nm { padding-left: 64px; }
.row[aria-level="6"] .nm { padding-left: 80px; }
.row[aria-level="7"] .nm { padding-left: 96px; }
.row[aria-level="8"] .nm { padding-left: 112px; }
.row[aria-level="9"] .nm { padding-left: 128px; }
.row[aria-level="10"] .nm { padding-left: 144px; }
.row[aria-level="11"] .nm { padding-left: 160px; }
.row[aria-level="12"] .nm { padding-left: 176px; }

/* Code colouring: colour is never the only cue, keywords are semibold and comments italic */
.code { font-family: var(--font-mono); color: var(--text); }
.tk-kw { color: var(--code-keyword); font-weight: 700; }
.tk-ty { color: var(--code-type); }
.tk-fn { color: var(--code-fn); font-weight: 600; }
.tk-st { color: var(--code-string); }
.tk-nu { color: var(--code-number); }
.tk-cm { color: var(--code-comment); font-style: italic; }
.tk-pu { color: var(--code-punct); }
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: var(--r-full); background: var(--cat-8); }
.dot.c1 { background: var(--cat-1); } .dot.c2 { background: var(--cat-2); } .dot.c3 { background: var(--cat-3); } .dot.c4 { background: var(--cat-4); }
.dot.c5 { background: var(--cat-5); } .dot.c6 { background: var(--cat-6); } .dot.c7 { background: var(--cat-7); }
.dot.act-high { background: var(--act-high); } .dot.act-medium { background: var(--act-mid); } .dot.act-low { background: var(--act-low); }
.with-dot { display: inline-flex; align-items: center; gap: var(--s-2); }
.legend .dot { margin: 0 var(--s-1) 0 var(--s-3); }
.dep-in h2 { color: var(--dir-in); }
.dep-out h2 { color: var(--accent-text); }
.dep-in h2::before { content: "\2190  "; }
.dep-out h2::before { content: "\2192  "; }
.sym-item .dot { margin-right: var(--s-2); }
.sig .code, .exports .code { color: inherit; }

/* Agent tab, map tools */
.agent { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--s-8); max-width: 1180px; margin: 0 auto; align-items: start; }
.agent h2 { font-size: var(--fs-md); font-weight: 650; margin-bottom: var(--s-2); }
.agent .lede { color: var(--muted); font-size: var(--fs-sm); margin-bottom: var(--s-4); max-width: 60ch; }
.kinds { display: flex; flex-wrap: wrap; gap: var(--s-1); margin: var(--s-3) 0; }
.kind { min-height: 32px; padding: 0 var(--s-3); background: transparent; border: 1px solid var(--line); border-radius: var(--r-full); color: var(--muted); font-size: var(--fs-sm); }
.kind:hover { color: var(--text); border-color: var(--line-strong); }
.kind[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.prompt { margin: var(--s-3) 0; padding: var(--s-4); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-2); font: var(--fs-sm)/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
.prompt-bar { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.scope-row { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
.feed > li { padding: var(--s-4) 0; border-bottom: 1px solid var(--line); }
.feed h3 { font-size: var(--fs-md); font-weight: 600; display: flex; align-items: baseline; gap: var(--s-2); overflow-wrap: anywhere; }
.feed p { margin-top: var(--s-1); color: var(--muted); font-size: var(--fs-sm); }
.feed .row-actions { display: flex; gap: var(--s-2); margin-top: var(--s-2); flex-wrap: wrap; }
.mini-btn { min-height: 32px; padding: 0 var(--s-3); background: transparent; border: 1px solid var(--line); border-radius: var(--r-2); font-size: var(--fs-sm); }
.mini-btn:hover { background: var(--sunk); border-color: var(--line-strong); }
.tools { position: absolute; top: var(--s-4); right: var(--s-6); z-index: 4; max-width: calc(100% - var(--s-12)); }
.tools summary { list-style: none; cursor: pointer; padding: var(--s-1) var(--s-3); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-full); font-size: var(--fs-sm); color: var(--muted); }
.tools summary::-webkit-details-marker { display: none; }
.tools[open] summary { color: var(--text); }
.tools-body { margin-top: var(--s-2); padding: var(--s-4); width: 260px; max-width: 100%; display: grid; gap: var(--s-3); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-3); box-shadow: var(--shadow); }
.tools-body label { display: grid; gap: var(--s-1); font-size: var(--fs-xs); color: var(--faint); }
.tools-body .check { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-sm); color: var(--text); }
.tools-body .btns { display: flex; gap: var(--s-1); flex-wrap: wrap; }
.act-row { display: flex; gap: var(--s-2); flex-wrap: wrap; margin-top: var(--s-4); }
.act-row .mini-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.hops li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s-2); padding: var(--s-1) 0; font: var(--fs-sm)/1.4 var(--font-mono); overflow-wrap: anywhere; }
.hops .n { color: var(--faint); font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.hops [aria-current="true"] .t { color: var(--accent-text); font-weight: 700; }
.hops .why { display: block; color: var(--muted); font: var(--fs-xs)/1.4 var(--font-ui); }
.flow-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); pointer-events: auto; }
.flow-bar .select { max-width: 260px; background: var(--raised); }
.cmp { width: 100%; font-size: var(--fs-sm); margin-top: var(--s-2); }
.cmp td, .cmp th { padding: var(--s-1) var(--s-2); }
.keys { max-width: 520px; }
.keys-body { padding: var(--s-6); overflow: auto; }
.keys-body h2 { font-size: var(--fs-md); margin-bottom: var(--s-3); }
.keys-body li { display: flex; gap: var(--s-3); padding: var(--s-1) 0; color: var(--muted); font-size: var(--fs-sm); }
.keys-body li kbd { min-width: 64px; text-align: center; }
@media (max-width: 900px) {
  .agent { grid-template-columns: 1fr; }
  .tools { right: var(--s-4); top: var(--s-12); }
}

.main.no-panel { grid-template-columns: minmax(0, 1fr); }
.main.no-panel .panel { display: none; }
</style>
</head>
<body>
<a class="skip" href="#views">Skip to content</a>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="mark" id="mark" role="img" aria-label="Stacklit">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect class="top-layer" x="8" y="3" width="13" height="5" rx="1.5" fill="currentColor"/><rect x="3" y="9.5" width="18" height="5" rx="1.5" fill="currentColor"/><rect x="3" y="16" width="13" height="5" rx="1.5" fill="currentColor"/></svg>
      </span>
      <div class="brand-text">
        <h1 id="proj-name">Stacklit map</h1>
        <p class="sub" id="proj-sub"></p>
      </div>
    </div>
    <div class="actions">
      <button class="btn search-btn" id="btn-search" type="button" aria-haspopup="dialog" aria-keyshortcuts="/ Control+K Meta+K">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <span>Search<span class="lbl-long"> modules and symbols</span></span><kbd>/</kbd>
      </button>
      <button class="btn icon" id="btn-theme" type="button" aria-label="Switch color theme" title="Switch color theme">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.25"/><path d="M8 2.75v10.5" /><path d="M8 2.75a5.25 5.25 0 0 1 0 10.5z" fill="currentColor"/></svg>
      </button>
      <button class="btn icon" id="btn-save" type="button" aria-label="Save a copy of this page" title="Save a copy of this page">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.75 7.75 8 11l3.25-3.25M3 13.5h10"/></svg>
      </button>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Views" id="tabs">
    <button class="tab" role="tab" id="tab-overview" data-tab="overview" aria-controls="view-overview" aria-selected="false" tabindex="-1">Overview</button>
    <button class="tab" role="tab" id="tab-map" data-tab="map" aria-controls="view-map" aria-selected="true">Map</button>
    <button class="tab" role="tab" id="tab-tree" data-tab="tree" aria-controls="view-tree" aria-selected="false" tabindex="-1">Tree</button>
    <button class="tab" role="tab" id="tab-table" data-tab="table" aria-controls="view-table" aria-selected="false" tabindex="-1">Table</button>
    <button class="tab" role="tab" id="tab-flow" data-tab="flow" aria-controls="view-flow" aria-selected="false" tabindex="-1">Flow</button>
    <button class="tab" role="tab" id="tab-agent" data-tab="agent" aria-controls="view-agent" aria-selected="false" tabindex="-1">Agent</button>
    <button class="tab" role="tab" id="tab-symbols" data-tab="symbols" aria-controls="view-symbols" aria-selected="false" tabindex="-1" hidden>Symbols</button>
  </div>

  <div class="main">
    <main class="views" id="views" tabindex="-1">
      <section class="view scroll" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"><div class="pad ov" id="ov"></div></section>

      <section class="view" id="view-map" role="tabpanel" aria-labelledby="tab-map">
        <div class="stage-wrap" id="map-wrap">
          <canvas class="stage" id="map-canvas" tabindex="0" role="img" aria-label="Dependency map of modules"></canvas>
          <div class="crumbs" id="map-crumbs"></div>
          <details class="tools" id="map-tools">
            <summary>Filters and export</summary>
            <div class="tools-body" id="map-tools-body"></div>
          </details>
          <div class="toolbar" role="group" aria-label="Map controls">
            <button class="btn icon" type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
            <button class="btn icon" type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out (-)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg></button>
            <button class="btn icon" type="button" data-zoom="fit" aria-label="Fit to screen" title="Fit to screen (0)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
          </div>
          <p class="legend" id="map-legend"></p>
          <div class="minimap" id="map-mini" hidden><canvas aria-hidden="true"></canvas></div>

          <div class="tree-tools"><button class="btn" type="button" id="tree-expand">Expand all</button><button class="btn" type="button" id="tree-collapse">Collapse all</button></div>

          <span class="note" id="tbl-count" aria-live="polite"></span>
        </div>
        <div class="tbl-wrap">
          <table id="tbl">
            <caption class="sr-only">All modules. Column headers sort the table.</caption>
            <thead><tr id="tbl-head"></tr></thead>
            <tbody id="tbl-body"></tbody>
          </table>
          <button class="more" id="tbl-more" type="button" hidden></button>
        </div>
      </section>

      <section class="view" id="view-flow" role="tabpanel" aria-labelledby="tab-flow">
        <div class="stage-wrap" id="flow-wrap">
          <canvas class="stage" id="flow-canvas" tabindex="0" role="img" aria-label="Dependency flow of modules, left to right"></canvas>
          <div class="crumbs" id="flow-crumbs"></div>
          <div class="toolbar" role="group" aria-label="Flow controls">
            <button class="btn icon" type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
            <button class="btn icon" type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out (-)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg></button>
            <button class="btn icon" type="button" data-zoom="fit" aria-label="Fit to screen" title="Fit to screen (0)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
          </div>
          <p class="legend" id="flow-legend"></p>
          <div class="minimap" id="flow-mini" hidden><canvas aria-hidden="true"></canvas></div>
        </div>
      </section>

      <section class="view scroll" id="view-agent" role="tabpanel" aria-labelledby="tab-agent"><div class="pad agent" id="agent"></div></section>

      <section class="view" id="view-symbols" role="tabpanel" aria-labelledby="tab-symbols">
        <div class="sym">
          <div class="sym-side">
            <div class="sym-filters">
              <label class="sr-only" for="sym-search">Search symbols</label>
              <input class="field" id="sym-search" type="search" placeholder="Search names, signatures, docs" autocomplete="off" spellcheck="false">
              <div class="row2">
                <label class="sr-only" for="sym-comm">Filter by cluster</label>
                <select class="select" id="sym-comm"><option value="">All clusters</option></select>
                <label class="sr-only" for="sym-kind">Filter by kind</label>
                <select class="select" id="sym-kind"><option value="">All kinds</option></select>
              </div>
            </div>
            <div class="sym-list" id="sym-list" role="list" aria-label="Symbols"></div>
            <div class="sym-count" id="sym-stat" aria-live="polite"></div>
          </div>
          <div class="sym-detail" id="sym-info"></div>
        </div>
      </section>
    </main>

    <aside class="panel" id="panel" aria-label="Details" tabindex="-1">
      <button class="btn icon panel-close" id="panel-close" type="button" aria-label="Close details"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      <div id="panel-body"></div>
    </aside>
  </div>

      if (s > 0) out.push({ s: s, kind: 'Export', label: e[0], sub: M[e[1]].id, run: function () { StackLit.selectModule(M[e[1]].id); } });
    });
    if (StackLit.symbolProvider) StackLit.symbolProvider(q, score).forEach(function (r) { out.push(r); });
    out.sort(function (a, b) { return b.s - a.s; });
    return out.slice(0, 40);
  }
  function renderPal() {
    palItems = searchAll(palIn.value.trim());
    clear(palList);
    palItems.forEach(function (it, i) {
      var r = h('div', 'res'); r.id = 'pal-' + i; r.setAttribute('role', 'option');
      var left = h('span'); left.appendChild(h('span', 'lbl', it.label)); if (it.sub) left.appendChild(h('span', 'sub', it.sub));
      r.appendChild(left); r.appendChild(h('span', 'kind', it.kind));
      r.addEventListener('click', function () { palPick(i); });
      palList.appendChild(r);
    });
    if (!palItems.length) palList.appendChild(h('p', 'pal-empty', 'Nothing matches. Try a shorter name.'));
    palSel = 0; palMark();
  }
  function palMark() {
    var rs = palList.querySelectorAll('.res');
    rs.forEach(function (r, i) { r.setAttribute('aria-selected', i === palSel ? 'true' : 'false'); });
    if (rs[palSel]) { palIn.setAttribute('aria-activedescendant', rs[palSel].id); rs[palSel].scrollIntoView({ block: 'nearest' }); } else palIn.removeAttribute('aria-activedescendant');
  }
  function palPick(i) { var it = palItems[i]; if (!it) return; pal.close(); it.run(); }
  function openPalette(prefill) {
    if (pal.open) return;
    opener = document.activeElement;
    palIn.value = prefill || '';
    if (pal.showModal) pal.showModal(); else pal.setAttribute('open', '');
    renderPal(); palIn.focus();
  }
  pal.addEventListener('close', function () { if (opener && opener.focus) opener.focus(); });
  pal.addEventListener('click', function (ev) { if (ev.target === pal) pal.close(); });
  palIn.addEventListener('input', renderPal);
  palIn.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowDown') { palSel = Math.min(palItems.length - 1, palSel + 1); palMark(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); palMark(); ev.preventDefault(); }
    else if (ev.key === 'Enter') { palPick(palSel); ev.preventDefault(); }
  });
  $('#btn-search').addEventListener('click', function () { openPalette(''); });

  // ---- Tabs, empty states, startup ------------------------------------------------------------
  var TABS = ['overview', 'map', 'tree', 'table', 'flow', 'agent', 'symbols'];
  function visibleTabs() { return TABS.filter(function (t) { return !$('#tab-' + t).hidden; }); }
  function switchTab(name, quiet) {
    if (TABS.indexOf(name) < 0 || $('#tab-' + name).hidden) name = 'map';
    S.tab = name;
    TABS.forEach(function (t) {
      var b = $('#tab-' + t), on = t === name;
      b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
      $('#view-' + t).classList.toggle('active', on);
    });
    $('.main').classList.toggle('no-panel', name === 'symbols' || name === 'agent');
    if (name === 'map') { mapStage.resize(); }
    if (name === 'flow') { flowStage.resize(); }
    if (name === 'tree') markTree();
    document.dispatchEvent(new CustomEvent('stk:tab', { detail: name }));
    if (!quiet) writeHash();
  }
  $('#tabs').addEventListener('click', function (ev) { var b = ev.target.closest('.tab'); if (b) switchTab(b.getAttribute('data-tab')); });
  $('#tabs').addEventListener('keydown', function (ev) {
    var tabs = visibleTabs(), i = tabs.indexOf(S.tab), j = -1;
    if (ev.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (ev.key === 'ArrowLeft') j = (i + tabs.length - 1) % tabs.length;
    else if (ev.key === 'Home') j = 0;
    else if (ev.key === 'End') j = tabs.length - 1;
    if (j < 0) return;
    ev.preventDefault(); switchTab(tabs[j]); $('#tab-' + tabs[j]).focus();
  });

  function soloCard(view, title, lines, next) {
    var wrap = view.querySelector('.stage-wrap'); if (wrap) wrap.hidden = true;
    var box = h('div', 'solo'), card = h('div', 'card');
    card.appendChild(h('h2', null, title));
    lines.forEach(function (l) { card.appendChild(typeof l === 'string' ? h('p', null, l) : l); });
    if (next && next.length) {
      var n = h('div', 'next'); n.appendChild(h('h3', null, 'Next steps'));
      var ul = h('ul'); next.forEach(function (x) { var li = h('li'); x.forEach(function (p) { li.appendChild(typeof p === 'string' ? document.createTextNode(p) : p); }); ul.appendChild(li); });
      n.appendChild(ul); card.appendChild(n);
    }
    box.appendChild(card); view.appendChild(box);
  }
  function codeEl(t) { return h('code', null, t); }
  function setupEmptyStates() {
    var real = M.filter(function (m) { return !m.ext; });
    if (!M.length) {
      soloCard($('#view-map'), 'No modules found', ['Stacklit did not find source files it can map in this folder.'], [['Run ', codeEl('stacklit generate'), ' from the root of a repository with code in it.'], ['Check ', codeEl('.stacklitrc.json'), ' for ', codeEl('exclude'), ' patterns that hide everything.']]);
      soloCard($('#view-flow'), 'Nothing to show yet', ['The flow view needs at least two modules.'], null);
      return;
    }
    if (M.length === 1) {
      var m = M[0], f = h('div');
      f.appendChild(factList([['Files', m.files.toLocaleString()], ['Lines', m.lines.toLocaleString()], ['Exports', m.exports.length.toLocaleString()]]));
      var lines = [];
      if (m.mod.purpose) lines.push(m.mod.purpose);
      if (m.lang) { var lp = h('p', 'mod-lang'); lp.appendChild(langIcon(m.lang)); lp.appendChild(document.createTextNode(langName(m.lang))); lines.push(lp); }
      lines.push(f);
      if (m.exports.length) { var ex = h('ul', 'exports'); m.exports.slice(0, 6).forEach(function (x) { var li = h('li'); li.appendChild(code(x, m.lang)); ex.appendChild(li); }); lines.push(h('p', 'note', 'Exports')); lines.push(ex); }
      var next = [['This repository has one module, so there are no dependencies to draw. Add more packages or folders and run ', codeEl('stacklit generate'), ' again.']];
      if (!graphLoaded()) next.push(['Run ', codeEl('stacklit generate --graph'), ' to add the Symbols tab with callers and callees.']);
      next.push(['Press ', h('kbd', null, '/'), ' to search exports.']);
      var ex3 = h('div'); ex3.appendChild(h('p', 'note', 'Example prompts for your agent')); ['understand', 'find', 'review'].forEach(function (k) { var d = h('div'); d.appendChild(h('p', 'note', kindTitle({ type: 'repo' }, k))); promptBlock(d, { type: 'repo' }, k, 'Copy prompt'); ex3.appendChild(d); }); lines.push(ex3);
      soloCard($('#view-map'), m.id === '.' ? projName : m.id, lines, next);
      soloCard($('#view-flow'), 'One module', ['The flow view needs at least two modules that depend on each other.'], null);
    } else if (!E.length) {
      // several modules, no edges: the map still works, the flow view explains itself
      soloCard($('#view-flow'), 'No dependencies found', ['None of the ' + plural(real.length, 'module') + ' import each other, so there is nothing to lay out in layers.'], [['Use the Map tab to browse the modules by size.']]);
    }
  }
  function graphLoaded() {
    try { var g = JSON.parse($('#stacklit-graph').textContent); return !!(g && g.nodes && g.nodes.length); } catch (e) { return false; }
  }

  function applyHash() {
    var q = new URLSearchParams(location.hash.replace(/^#/, ''));
    var tab = q.get('tab') || 'map', m = q.get('m'), g = q.get('g');
    if (location.hash === '#selftest') { runSelfTest(); return; }
    var before = JSON.stringify([FILT, flowEntry]);
    readExtras(q);
    if (before !== JSON.stringify([FILT, flowEntry])) rebuildStages();
    if (g && groups[g] && M.length > LIM.direct) { level = g; rebuildStages(); S.group = g; }
    S.tab = TABS.indexOf(tab) >= 0 ? tab : 'map';
    if (m && byId[m] !== undefined) selectModule(byId[m]);
    else { renderPanel(); }
    updateOverlay();
    switchTab(S.tab, true);
    if (q.get('sym') !== null) document.dispatchEvent(new CustomEvent('stk:open-sym', { detail: +q.get('sym') }));
  }
  window.addEventListener('hashchange', applyHash);

  document.addEventListener('keydown', function (ev) {
    if (ev.defaultPrevented) return;
    var t = ev.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if ((ev.key === 'k' || ev.key === 'K') && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); openPalette(''); return; }
    if (typing || pal.open || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === '/') { ev.preventDefault(); openPalette(''); }
    else if (ev.key >= '1' && ev.key <= '7') { var v = visibleTabs()[+ev.key - 1]; if (v) switchTab(v); }
    else if (ev.key === 'Escape') { $('#panel').classList.remove('open'); }
  });

  readPalette();
  tree = buildTree();
  tree.kids.forEach(function (c) { if (c.kids.size) expanded.add(c.path); });
  if (M.length > 400) expanded = new Set();
  buildOverview(); buildHead(); renderTable(); renderTree();
  setupEmptyStates();
  if (M.length) rebuildStages(); else renderCrumbs();
  renderPanel();
  applyHash();
  document.addEventListener('stk:ready', function () { applyHash(); });
  $('#btn-save').addEventListener('click', function () {
    var url = URL.createObjectURL(new Blob([ORIGINAL], { type: 'text/html' }));
    var a = document.createElement('a');
    a.href = url; a.download = 'stacklit.html'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  });
  window.StackLit.switchTab = switchTab;
  window.StackLit.state = S;
  window.StackLit.writeHash = writeHash;
})();
</script>
<script>
// Symbols tab: searchable list with signature, location and callers. Runs after the main script.
(function () {
  var el = document.getElementById('stacklit-graph');
  var G = null;
  try { G = JSON.parse(el.textContent); } catch (e) { G = null; }
  var SL = window.StackLit;
  var tab = document.getElementById('tab-symbols');
  if (!G || !G.nodes || !G.nodes.length || !tab || !SL) return;
  tab.hidden = false;

  var h = SL.h, plural = SL.plural, clear = SL.clear;
  var searchEl = document.getElementById('sym-search'), commEl = document.getElementById('sym-comm'), kindEl = document.getElementById('sym-kind');
  var listEl = document.getElementById('sym-list'), infoEl = document.getElementById('sym-info'), statEl = document.getElementById('sym-stat');
  var N = G.nodes, E = G.edges, KINDS = G.kinds || [], PAGE = 100;
  var out = N.map(function () { return []; }), inn = N.map(function () { return []; });
  E.forEach(function (e) { out[e[0]].push(e); inn[e[1]].push(e); });
  var deg = N.map(function (_, i) { return out[i].length + inn[i].length; });
  var results = [], shown = 0, current = -1;
  var cnt = {}; N.forEach(function (n) { cnt[n.c] = (cnt[n.c] || 0) + 1; });
  var commRank = {}; Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).forEach(function (c, i) { commRank[c] = i; });
  function commCls(c) { var r = commRank[c]; return r === undefined || r > 6 ? '' : ' c' + (r + 1); }

  function loc(n) { return G.files[n.f] + ':' + n.l; }
  function fits(n, q) {
    if (commEl.value !== '' && String(n.c) !== commEl.value) return false;
    if (kindEl.value !== '' && n.k !== kindEl.value) return false;
    if (!q) return true;
    return n.n.toLowerCase().indexOf(q) >= 0 || (n.s || '').toLowerCase().indexOf(q) >= 0 || (n.d || '').toLowerCase().indexOf(q) >= 0 || G.files[n.f].toLowerCase().indexOf(q) >= 0;
  }
  function item(i) {
    var n = N[i], b = h('button', 'sym-item'); b.type = 'button';
    b.setAttribute('role', 'listitem');
    if (i === current) b.setAttribute('aria-current', 'true');
    var tt = h('b'); tt.appendChild(SL.dot(commCls(n.c)));
    tt.appendChild(document.createTextNode(n.n)); b.appendChild(tt);
    b.appendChild(h('span', null, n.k + ', ' + loc(n)));
    b.addEventListener('click', function () { open(i); });
    return b;
  }
  function more() {
    var end = Math.min(results.length, shown + PAGE), old = listEl.querySelector('.more');
    if (old) old.remove();
    for (; shown < end; shown++) listEl.appendChild(item(results[shown]));
    if (shown < results.length) {
      var b = h('button', 'more', 'Show ' + Math.min(PAGE, results.length - shown).toLocaleString() + ' more'); b.type = 'button';
      b.addEventListener('click', more); listEl.appendChild(b);
    }
  }
  function refresh() {
    var q = searchEl.value.trim().toLowerCase();
    results = [];
    for (var i = 0; i < N.length; i++) if (fits(N[i], q)) results.push(i);
    results.sort(function (a, b) {
      if (q) { var ea = N[a].n.toLowerCase() === q ? 1 : 0, eb = N[b].n.toLowerCase() === q ? 1 : 0; if (ea !== eb) return eb - ea; }
      return deg[b] - deg[a] || a - b;
    });
    clear(listEl); shown = 0; more();
    statEl.textContent = plural(results.length, 'symbol') + (G.total > N.length ? ' (the ' + N.length.toLocaleString() + ' most connected of ' + G.total.toLocaleString() + ')' : '');
    if (!results.length) listEl.appendChild(h('p', 'empty-note', 'No symbols match.'));
  }
  function relRows(parent, title, edges, ends) {
    if (!edges.length) return;
    var box = h('div'); box.appendChild(h('h3', null, title + ' (' + edges.length.toLocaleString() + ')'));
    edges.slice().sort(function (a, b) { return b[3] - a[3]; }).slice(0, 60).forEach(function (e) {
      var o = e[ends], n = N[o], b = h('button', 'link-row'); b.type = 'button';
      b.appendChild(h('span', null, n.n));
      b.appendChild(h('span', 'meta', (KINDS[e[2]] || 'links') + (e[4] ? ', inferred' : '') + ', ' + loc(n)));
      b.addEventListener('click', function () { open(o); });
      box.appendChild(b);
    });
    if (edges.length > 60) box.appendChild(h('p', 'empty-note', plural(edges.length - 60, 'more') + ' not shown.'));
    parent.appendChild(box);
  }
  function show(i) {
    var n = N[i];
    clear(infoEl);
    infoEl.appendChild(h('h2', 'sym-name', n.n));
    infoEl.appendChild(h('p', 'note', n.k + ' at ' + loc(n) + (n.e > n.l ? ' to line ' + n.e : '')));
    var mi = SL.moduleForFile(G.files[n.f]);
    if (mi !== undefined) {
      var mb = h('button', 'more', 'Open module ' + SL.moduleId(mi)); mb.type = 'button';
      mb.addEventListener('click', function () { SL.selectModule(SL.moduleId(mi)); });
      infoEl.appendChild(mb);
    }
    if (n.s) { var pre = h('pre', 'sig'); pre.appendChild(SL.code(n.s, SL.langOfFile(G.files[n.f]))); infoEl.appendChild(pre); }
    if (n.d) infoEl.appendChild(h('p', 'mod-purpose', n.d));
    if (G.comms[n.c]) infoEl.appendChild(h('p', 'note', 'Cluster: ' + G.comms[n.c].label));
    var cols = h('div', 'cols');
    relRows(cols, 'Used by', inn[i], 0);
    relRows(cols, 'Uses', out[i], 1);
    infoEl.appendChild(cols);
    if (!inn[i].length && !out[i].length) infoEl.appendChild(h('p', 'empty-note', 'No callers or callees were found for this symbol.'));
  }
  function open(i, quiet) {
    if (i < 0 || i >= N.length) return;
    current = i; show(i);
    SL.state.sym = i;
    listEl.querySelectorAll('.sym-item').forEach(function (b) { b.removeAttribute('aria-current'); });
    var idx = results.indexOf(i);
    if (idx >= 0 && idx < shown) { var b = listEl.querySelectorAll('.sym-item')[idx]; if (b) b.setAttribute('aria-current', 'true'); }
    if (!quiet) { SL.state.mod = -1; SL.switchTab('symbols'); }
    SL.writeHash();
  }

  G.comms.forEach(function (c, i) {
    var o = document.createElement('option'); o.value = String(i); o.textContent = c.label; commEl.appendChild(o);
  });
  var kinds = {};
  N.forEach(function (n) { kinds[n.k] = 1; });
  Object.keys(kinds).sort().forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = k; kindEl.appendChild(o); });
  [searchEl, commEl, kindEl].forEach(function (c) { c.addEventListener('input', refresh); });
  infoEl.appendChild(h('p', 'note', 'Pick a symbol to see its signature, where it lives and what calls it.'));
  refresh();

  SL.symbolProvider = function (q, score) {
    var hits = [];
    for (var i = 0; i < N.length; i++) {
      var s = score(q, N[i].n);
      if (s > 0) hits.push({ s: s - 2, kind: 'Symbol', label: N[i].n, sub: loc(N[i]), run: (function (k) { return function () { open(k); }; })(i) });
    }
    hits.sort(function (a, b) { return b.s - a.s; });
    return hits.slice(0, 15);
  };
  document.addEventListener('stk:open-sym', function (ev) { open(ev.detail, true); });
  document.addEventListener('stk:module-symbols', function (ev) {
    searchEl.value = ev.detail === '.' ? '' : ev.detail + '/'; refresh(); SL.switchTab('symbols'); searchEl.focus();
  });
  document.dispatchEvent(new CustomEvent('stk:ready'));
})();

</script>
