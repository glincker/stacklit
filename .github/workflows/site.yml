name: site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'USAGE.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'bench/RESULTS.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5.0.0
      # The demo maps are committed, so no Go toolchain is needed here.
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
