version: 2

before:
  hooks:
    # go mod tidy is not run here: it can dirty the tree and fail the release.
    - go mod download
    - sh -c 'rm -rf completions && mkdir completions && for sh in bash zsh fish; do go run ./cmd/stacklit completion $sh > completions/stacklit.$sh; done'

builds:
  - id: stacklit
    main: ./cmd/stacklit
    binary: stacklit
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/glincker/stacklit/internal/cli.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "stacklit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  github:
    owner: glincker
    name: stacklit

brews:
  - name: stacklit
    repository:
      owner: glincker
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key that can write only to the tap repo.
      git:
        url: "git@github.com:glincker/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
        ssh_command: "ssh -i {{ .KeyPath }} -o StrictHostKeyChecking=accept-new -F /dev/null"
    homepage: https://github.com/glincker/stacklit
    description: A committed map of your codebase for AI coding agents
    license: MIT
    directory: Formula
    install: |
      bin.install "stacklit"
      bash_completion.install "completions/stacklit.bash" => "stacklit"
      zsh_completion.install "completions/stacklit.zsh" => "_stacklit"
      fish_completion.install "completions/stacklit.fish"
    test: |
      assert_match version.to_s, shell_output("#{bin}/stacklit version")
